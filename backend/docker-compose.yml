services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: shelf, POSTGRES_PASSWORD: shelf, POSTGRES_DB: shelfsight }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U shelf"], interval: 3s, retries: 10 }
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://shelf:shelf@db:5432/shelfsight
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
volumes: { pgdata: {} }
